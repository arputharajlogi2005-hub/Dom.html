<!DOCTYPE html>
<html>
<head>
    <title>DOM Menu</title>
</head>
<body>

    <h2>Menu Driven Program</h2>

    <input type="text" id="text" placeholder="Enter text">

    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">

    <br><br>

    <button onclick="readText()">1. Read Text from DOM</button>
    <button onclick="addNumbers()">2. Add Two Numbers</button>
    <button onclick="changeCSS()">3. Change CSS using DOM</button>
    <button onclick="exitProgram()">4. Exit</button>

    <h3 id="result">Result</h3>

    <script>

        function readText() {
            let text = document.getElementById("text").value;
            document.getElementById("result").innerHTML = text;
        }

        function addNumbers() {
            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);

            document.getElementById("result").innerHTML = a + b;
        }

        function changeCSS() {
            document.getElementById("result").style.color = "red";
            document.getElementById("result").style.backgroundColor = "yellow";
            document.getElementById("result").style.fontSize = "30px";
        }

        function exitProgram() {
            document.getElementById("result").innerHTML = "Program Exited!";
        }

    </script>

</body>
</html>
